<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body class="{{ page.body_class | default: '' }}">

  <!-- Canvas the moving pink stars are drawn on. Sits fixed behind everything. -->
  <canvas id="star-field" aria-hidden="true"></canvas>

  <!-- Custom star cursor element, positioned by assets/js/cursor.js -->
  <div id="star-cursor" aria-hidden="true">
    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 2 L24.5 15.5 L38 20 L24.5 24.5 L20 38 L15.5 24.5 L2 20 L15.5 15.5 Z"/>
    </svg>
  </div>

  {% include header.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/stars.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/cursor.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
