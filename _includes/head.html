<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.first_name }} {{ site.last_name }}{% else %}{{ site.first_name }} {{ site.last_name }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- // EDIT: replace with your own favicon if you have one, in /assets/img/ -->
  <link rel="icon" href="data:,">

  <!-- Fonts: "Baloo 2" = the chunky rounded display face used for the bubble
       name lockup + big headlines. "Space Grotesk" = the geometric sans used
       for nav/body/UI. Swap either family name here to change the whole look. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
